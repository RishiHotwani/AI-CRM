services:
  # Spring Boot Backend
  - type: web
    name: clinch-crm-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DDL_AUTO
        value: update
      - key: H2_CONSOLE_ENABLED
        value: false
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:file:/app/data/clinchcrm;DB_CLOSE_DELAY=-1;MODE=MySQL
      - key: SPRING_DATASOURCE_USERNAME
        value: sa
      - key: SPRING_DATASOURCE_PASSWORD
        value: ""
      - key: JPA_PLATFORM
        value: org.hibernate.dialect.H2Dialect
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://ai-crm-iota-lovat.vercel.app
    disk:
      name: clinch-crm-data
      mountPath: /app/data
      sizeGB: 1
